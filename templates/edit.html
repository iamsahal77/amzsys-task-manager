{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm fade-in-up">
      <div class="card-body">
        <h5 class="card-title mb-3">Edit Task</h5>
        <form method="post" action="{{ url_for('update', task_id=task['id']) }}">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ task['title'] }}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ task['description'] }}</textarea>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label">Category</label>
              <input name="category" class="form-control" value="{{ task['category'] or '' }}" />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label">Priority</label>
              <select name="priority" class="form-select">
                <option value="Low" {% if task['priority']=='Low' %}selected{% endif %}>Low</option>
                <option value="Medium" {% if (task['priority'] or 'Medium')=='Medium' %}selected{% endif %}>Medium</option>
                <option value="High" {% if task['priority']=='High' %}selected{% endif %}>High</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Due date</label>
            <input type="date" name="due_date" class="form-control" value="{{ (task['due_date'] or '')[:10] if task['due_date'] }}" />
          </div>
          <div class="d-flex gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
